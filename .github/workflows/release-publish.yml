name: release-publish.yml

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org/"

      - name: Install supported npm for trusted publishing
        run: npm install -g npm@11.6.2

      - name: Verify release tag matches package version
        run: |
          node -e 'const p=require("./package.json"); const expected=`v${p.version}`; if (p.version.includes("-") || process.env.GITHUB_REF_NAME !== expected) { throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must equal stable package tag ${expected}`); }'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
