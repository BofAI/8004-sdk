name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  typescript-matrix:
    name: TS SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.23.4"
          - "24.22.1"
          - "26.12.1"
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  typescript:
    name: TS SDK
    if: always()
    needs: typescript-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify Node.js matrix
        env:
          MATRIX_RESULT: ${{ needs.typescript-matrix.result }}
        run: test "$MATRIX_RESULT" = "success"

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install .[dev]
      - run: ruff check .
      - run: pytest || if [ $? -eq 5 ]; then exit 0; else exit $?; fi
